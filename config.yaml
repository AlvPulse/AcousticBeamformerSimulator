array:
  geo_file: array_geo.txt
  spatial_window: false  # true to apply radial blackman

source:
  type: tone # tone, chirp, noise, wav
  freq_hz: 2000.0 # pure tone freq or center freq
  f_start: 500.0 # for chirp
  f_end: 4000.0 # for chirp
  duration_s: 0.1
  fs: 48000
  spl_db: 80.0 # at 1m
  az: 30.0 # degrees
  el: 15.0 # degrees
  r: 5.0 # meters

environment:
  temp_c: 20.0
  rel_humidity: 50.0
  pressure_kpa: 101.325
  c: 343.0
  ground_effect_loss_db: 0.0 # Deterministic loss added (e.g., 3.0 for soft ground)
  shadowing_std_db: 0.0      # Standard deviation for log-normal shadowing variation

noise:
  independent_sensor_spl_db: 40.0 # added to each sensor independently
  directional:
    enabled: false
    spl_db: 50.0 # at 1m
    az: -45.0
    el: 0.0
    r: 10.0

processing:
  high_pass_fc: 0.0 # 0.0 means no filtering

sweep:
  # For Pass 2, but keep placeholders
  frequencies: [500, 1000, 2000, 4000]
  distances: [1.0, 5.0, 20.0, 100.0]
  az_grid_spacing: 2.0
  el_grid_spacing: 2.0
